<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste Backup Firebase</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Arial,sans-serif;padding:2rem;background:#f5f5f5}
.btn{padding:10px 20px;margin:6px;border-radius:8px;border:1px solid #ddd;cursor:pointer;font-size:14px}
.red{background:#C8102E;color:#fff;border-color:#C8102E}
.green{background:#5A8A2C;color:#fff;border-color:#5A8A2C}
#log{margin-top:1rem;background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;min-height:100px;font-size:13px;color:#333}
</style>
</head>
<body>
<h2>🔧 Teste de Backup — Firebase</h2>
<p>Cole suas credenciais e clique nos botões para testar:</p>

<button class="btn red" onclick="testarConexao()">1. Testar conexão Firebase</button>
<button class="btn green" onclick="exportarProdutosJSON()">2. Exportar Produtos (JSON)</button>
<button class="btn green" onclick="exportarProdutosExcel()">3. Exportar Produtos (Excel)</button>

<div id="log">Aguardando...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8k8y5i1TyikPlo_ZGuGC6jvMsHkuja8A",
  authDomain: "catalogo-materiais-de-obras.firebaseapp.com",
  projectId: "catalogo-materiais-de-obras",
  storageBucket: "catalogo-materiais-de-obras.firebasestorage.app",
  messagingSenderId: "817829487820",
  appId: "1:817829487820:web:f74486113206299b3ace69"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

function log(msg){ document.getElementById('log').innerHTML += '<p>' + new Date().toLocaleTimeString() + ' — ' + msg + '</p>'; }

window.testarConexao = async function(){
  log('Conectando ao Firebase...');
  try{
    const snap = await getDocs(collection(db,'produtos'));
    log('✅ Conectado! Produtos encontrados: ' + snap.size);
  }catch(e){ log('❌ Erro: ' + e.message); }
}

window.exportarProdutosJSON = async function(){
  log('Exportando Produtos (JSON)...');
  try{
    const snap = await getDocs(collection(db,'produtos'));
    const dados = snap.docs.map(d => {
      const data = {...d.data()};
      if(data.foto && data.foto.length > 100) data.foto = '[foto_omitida]';
      return {id: d.id, ...data};
    });
    const json = JSON.stringify({total: dados.length, dados}, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'produtos_teste.json'; a.click();
    URL.revokeObjectURL(url);
    log('✅ JSON exportado! ' + dados.length + ' produtos');
  }catch(e){ log('❌ Erro: ' + e.message); }
}

window.exportarProdutosExcel = async function(){
  log('Exportando Produtos (Excel)...');
  try{
    const snap = await getDocs(collection(db,'produtos'));
    const dados = snap.docs.map(d => {
      const data = {...d.data()};
      if(data.foto && data.foto.length > 100) data.foto = '[foto_omitida]';
      return {id: d.id, ...data};
    });
    const chaves = [...new Set(dados.flatMap(d => Object.keys(d)))];
    const rows = [chaves, ...dados.map(d => chaves.map(k => {
      const v = d[k];
      if(v===null||v===undefined) return '';
      if(typeof v==='object'&&v.seconds) return new Date(v.seconds*1000).toLocaleDateString('pt-BR');
      if(typeof v==='object') return JSON.stringify(v);
      return v;
    }))];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Produtos');
    XLSX.writeFile(wb, 'produtos_teste.xlsx');
    log('✅ Excel exportado! ' + dados.length + ' produtos');
  }catch(e){ log('❌ Erro: ' + e.message); }
}

log('Página carregada. Pronto para testar!');
</script>
</body>
</html>
