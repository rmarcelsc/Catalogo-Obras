<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Backup — Catálogo FC</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:Arial,sans-serif;padding:2rem;background:#f5f5f5;max-width:900px;margin:0 auto}
  h2{color:#C8102E}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:1.5rem}
  .card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden}
  .card-header{padding:10px 14px}
  .card-header span{font-size:14px;font-weight:600;color:#fff}
  .card-body{padding:12px 14px}
  .card-count{font-size:12px;color:#888;margin-bottom:10px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{padding:6px 12px;border-radius:6px;border:1px solid #ddd;cursor:pointer;font-size:12px;background:#fff}
  .btn:hover{background:#f5f5f5}
  .btn-red{background:#C8102E;color:#fff;border-color:#C8102E;padding:10px 20px;font-size:14px;border-radius:8px}
  .btn-green{background:#5A8A2C;color:#fff;border-color:#5A8A2C;padding:10px 20px;font-size:14px;border-radius:8px}
  .btn-gray{background:#3F3F3F;color:#fff;border-color:#3F3F3F;padding:10px 20px;font-size:14px;border-radius:8px}
  .full-section{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
  #log{margin-top:1rem;background:#fff;border:1px solid #ddd;border-radius:8px;padding:1rem;min-height:80px;max-height:200px;overflow-y:auto;font-size:12px;color:#333}
</style>
</head>
<body>

<h2>🗄️ Backup — Catálogo de Materiais FC</h2>

<div class="grid">
  <div class="card">
    <div class="card-header" style="background:#C8102E"><span>📦 Produtos</span></div>
    <div class="card-body">
      <p class="card-count" id="count-produtos">—</p>
      <div class="btns">
        <button class="btn" onclick="expJSON('produtos','Produtos')">JSON</button>
        <button class="btn" onclick="expXLS('produtos','Produtos')">Excel</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header" style="background:#5A8A2C"><span>🏭 Estoques</span></div>
    <div class="card-body">
      <p class="card-count" id="count-estoques">—</p>
      <div class="btns">
        <button class="btn" onclick="expJSON('estoques','Estoques')">JSON</button>
        <button class="btn" onclick="expXLS('estoques','Estoques')">Excel</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header" style="background:#3F3F3F"><span>🔄 Histórico</span></div>
    <div class="card-body">
      <p class="card-count" id="count-historico">—</p>
      <div class="btns">
        <button class="btn" onclick="expJSON('historico','Historico')">JSON</button>
        <button class="btn" onclick="expXLS('historico','Historico')">Excel</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header" style="background:#856404"><span>📋 Pedidos</span></div>
    <div class="card-body">
      <p class="card-count" id="count-pedidos">—</p>
      <div class="btns">
        <button class="btn" onclick="expJSON('pedidos','Pedidos')">JSON</button>
        <button class="btn" onclick="expXLS('pedidos','Pedidos')">Excel</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header" style="background:#1A3A6B"><span>👥 Usuários</span></div>
    <div class="card-body">
      <p class="card-count" id="count-usuarios">—</p>
      <div class="btns">
        <button class="btn" onclick="expJSON('usuarios','Usuarios')">JSON</button>
        <button class="btn" onclick="expXLS('usuarios','Usuarios')">Excel</button>
      </div>
    </div>
  </div>
</div>

<div class="full-section">
  <p style="font-size:14px;font-weight:600;color:#3F3F3F;margin-bottom:8px">🗃️ Backup completo</p>
  <p style="font-size:13px;color:#888;margin-bottom:12px">Exporta todas as coleções de uma vez.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn-red" onclick="expTudoJSON()">📄 Tudo em JSON</button>
    <button class="btn-green" onclick="expTudoExcel()">📊 Tudo em Excel</button>
  </div>
</div>

<div id="log">Carregando contadores...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8k8y5i1TyikPlo_ZGuGC6jvMsHkuja8A",
  authDomain: "catalogo-materiais-de-obras.firebaseapp.com",
  projectId: "catalogo-materiais-de-obras",
  storageBucket: "catalogo-materiais-de-obras.firebasestorage.app",
  messagingSenderId: "817829487820",
  appId: "1:817829487820:web:f74486113206299b3ace69"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const COLS = [
  {id:'produtos',  nome:'Produtos'},
  {id:'estoques',  nome:'Estoques'},
  {id:'historico', nome:'Historico'},
  {id:'pedidos',   nome:'Pedidos'},
  {id:'usuarios',  nome:'Usuarios'},
];

function log(msg){
  const el = document.getElementById('log');
  el.innerHTML += '<p style="margin:2px 0">' + new Date().toLocaleTimeString('pt-BR') + ' — ' + msg + '</p>';
  el.scrollTop = el.scrollHeight;
}

function dataHoje(){ return new Date().toLocaleDateString('pt-BR').replace(/\//g,'-'); }

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

async function buscar(colId){
  const snap = await getDocs(collection(db, colId));
  return snap.docs.map(d => {
    const data = {...d.data()};
    if(data.foto && data.foto.length > 100) data.foto = '[foto_omitida]';
    Object.keys(data).forEach(k => {
      if(data[k] && typeof data[k]==='object' && data[k].seconds)
        data[k] = new Date(data[k].seconds*1000).toLocaleDateString('pt-BR');
    });
    return {id: d.id, ...data};
  });
}

function toSheet(dados){
  const chaves = [...new Set(dados.flatMap(d => Object.keys(d)))];
  const rows = [chaves, ...dados.map(d => chaves.map(k => {
    const v = d[k];
    if(v===null||v===undefined) return '';
    if(typeof v==='object') return JSON.stringify(v);
    return v;
  }))];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = chaves.map(k=>({wch: k==='nome'?38:k==='obs'||k==='observacoes'?25:16}));
  return {ws, chaves};
}

// Carrega contadores ao abrir
(async ()=>{
  for(const c of COLS){
    try{
      const snap = await getDocs(collection(db, c.id));
      const el = document.getElementById('count-'+c.id);
      if(el) el.textContent = snap.size + ' registro(s)';
    }catch(e){
      const el = document.getElementById('count-'+c.id);
      if(el) el.textContent = 'Sem acesso';
    }
  }
  log('✅ Contadores carregados. Pronto para exportar!');
})();

window.expJSON = async function(colId, nome){
  log('Exportando ' + nome + ' (JSON)...');
  try{
    const dados = await buscar(colId);
    const json = JSON.stringify({colecao:colId, exportadoEm:new Date().toISOString(), total:dados.length, dados}, null, 2);
    download(new Blob([json],{type:'application/json'}), colId+'_'+dataHoje()+'.json');
    log('✅ ' + nome + ': ' + dados.length + ' registros exportados');
  }catch(e){ log('❌ Erro em ' + nome + ': ' + e.message); }
}

window.expXLS = async function(colId, nome){
  log('Exportando ' + nome + ' (Excel)...');
  try{
    const dados = await buscar(colId);
    if(!dados.length){ log('⚠️ Sem dados em ' + nome); return; }
    const {ws} = toSheet(dados);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, nome.substring(0,31));
    XLSX.writeFile(wb, colId+'_'+dataHoje()+'.xlsx');
    log('✅ ' + nome + ': ' + dados.length + ' registros exportados');
  }catch(e){ log('❌ Erro em ' + nome + ': ' + e.message); }
}

window.expTudoJSON = async function(){
  log('Iniciando backup completo (JSON)...');
  const backup = {exportadoEm: new Date().toISOString(), colecoes:{}};
  for(const c of COLS){
    try{
      backup.colecoes[c.id] = await buscar(c.id);
      log('  ✅ ' + c.nome + ': ' + backup.colecoes[c.id].length + ' registros');
    }catch(e){ log('  ❌ ' + c.nome + ': ' + e.message); }
  }
  download(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}), 'backup_completo_'+dataHoje()+'.json');
  log('✅ Backup JSON completo exportado!');
}

window.expTudoExcel = async function(){
  log('Gerando Excel completo...');
  const wb = XLSX.utils.book_new();
  for(const c of COLS){
    try{
      const dados = await buscar(c.id);
      if(!dados.length){ log('  ⚠️ ' + c.nome + ' sem dados'); continue; }
      const {ws} = toSheet(dados);
      XLSX.utils.book_append_sheet(wb, ws, c.nome.substring(0,31));
      log('  ✅ ' + c.nome + ': ' + dados.length + ' registros');
    }catch(e){ log('  ❌ ' + c.nome + ': ' + e.message); }
  }
  XLSX.writeFile(wb, 'backup_completo_'+dataHoje()+'.xlsx');
  log('✅ Excel completo exportado!');
}
</script>
</body>
</html>
